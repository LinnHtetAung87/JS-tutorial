<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="./style.css" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <h4> Text Editor</h4>
        <div class="row">
            <div class="col-md-12">
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Bold Text" data-command="bold">Bold</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Italic Text" data-command="italic">Italic</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Underline Text" data-command="underline">Underline</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Line Through Text" data-command="linethrough">Line Through</button>


                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Left Text" data-command="justifyLeft"><i class="fas fa-align-left"></i>Left</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Center Text" data-command="justifyCenter"><i class="fas fa-align-center"></i>Center</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Right Text" data-command="justifyRight"><i class="fas fa-align-right"></i>Right</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Justify Text" data-command="justifyFull"><i class="fas fa-align-justify"></i>Full</button>


                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Upper Text">Upper Case</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Lower Text">Lower Case</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Capitalize Text">Capitalize Case</button>


                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Subscript Text" data-command="subscript"><i class="fas fa-subscript"></i></button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Superscript Text" data-command="superscript"><i class="fas fa-superscript"></i></button>

                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Horizontal Ruler" data-command="insertHorizontalRule"><i class="fas fa-ruler"></i></button>

                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Order List" data-command="insertOrderedList"><i class="fas fa-list-ol"></i></button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Unorder List" data-command="insertUnorderedList"><i class="fas fa-list-ul"></i></button>

                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Select All Text" data-command="selectalltext"><i class="fas fa-check"></i></button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Backspace" data-command="delete"><i class="fas fa-backspace"></i></button>

                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Forward Delete" data-command="forwarddelete"><i class="fas fa-trash-alt"></i></button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Redo" data-command="redo"><i class="fas fa-redo"></i></button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Undo" data-command="undo"><i class="fas fa-undo"></i></button>

                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Link" data-command="createlink"><i class="fas fa-link"></i></button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Unlink" data-command="unlink"><i class="fas fa-unlink"></i></button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Image" data-command="insertimage"><i class="fas fa-image"></i></button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Copy" data-command="copy"><i class="fas fa-copy"></i></button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Cut" data-command="cut"><i class="fas fa-cut"></i></button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Paste" data-command="paste"><i class="fas fa-paste"></i></button>
                <select name="txtcolor" id="txtcolor" class="btn btn-outline-secondary round-0" data-command="forecolor">
                    <option value="black">Black</option>
                    <option value="white">White</option>
                    <option value="red">Red</option>
                    <option value="green">Green</option>
                    <option value="blue">Blue</option>
                </select>

                <select name="bgcolor" id="bgcolor" class="btn btn-outline-secondary round-0" data-command="backcolor">
                    <option value="black">Black</option>
                    <option value="white">White</option>
                    <option value="red">Red</option>
                    <option value="green">Green</option>
                    <option value="blue">Blue</option>
                </select>

                <select name="fntname" id="fntname" class="btn btn-outline-secondary round-0" data-command="fontName">
                    <option value="aria">Arial</option>
                    <option value="century">Century</option>
                    <option value="sans-serif">Sans-Serif</option>
                    <option value="time new roman">Times New Roman</option>
                </select>
                
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Clear Text" data-command="cleartext">Clear</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-0" title="Remove Text" data-command="removetext">Remove</button>

            </div>
        </div>
        
        <div class="row">
            <div class="col-md-12">
                <form action="" method="">
                    <div class="form-group">
                        <div id="divarea" class="divarea" contenteditable="true"></div>

                    </div>
                    <div class="text-end">
                        <button type="button" class="btn btn-danger">Cancel</button>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="./app.js" type="text/javascript"></script>
</body>
</html>
