<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="./style.css" rel="stylesheet" />
</head>
<body>
    <div>
        <h2>Model sigup form</h2>
        <button type="button" id="signup-btn">Sign up</button>
        <button type="button" id="fullscreen-btn">open full screen</button>
        <button type="button" id="closefullscreen-btn">close full</button>
    </div>
           
    <div it="signupmodal" class="modal">
        <span class="btn-close" title="Close Modal">&times;</span>
        <form action="" method="">
            <h2>Register Form</h2>
            <div class="input-group">
                <i class="fas fa-solid fa-user icon"></i>
                <input type="text" name="username" id="username"  class="input-group-text " placeholder="Username"/>
            </div>
            <div class="input-group">
                <i class="fas fa-solid fa-envelope icon"></i>
                <input type="email" name="email" id="email"  class="input-group-text " placeholder="Email"/>
            </div>
            <div class="input-group">
                <i class="fas fa-solid fa-lock icon"></i>
                <input type="password" name="password" id="password"  class="input-group-text " placeholder="Password"/>
            </div>
            <button type="submit" class="btn">Register</button>

        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="./app.js" type="text/javascript"></script>
</body>
</html>
